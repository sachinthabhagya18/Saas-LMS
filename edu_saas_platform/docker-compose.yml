version: '3.8'

services:
  # --- Database ---
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=saas_lms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=CHANGE_THIS_PASSWORD_TO_SOMETHING_SECURE
    restart: always

  # --- Backend (Django) ---
  backend:
    build: ./backend
    command: /entrypoint.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - 8000
    environment:
      - DEBUG=0
      - SECRET_KEY=CHANGE_THIS_TO_A_LONG_RANDOM_STRING
      - POSTGRES_DB=saas_lms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=CHANGE_THIS_PASSWORD_TO_SOMETHING_SECURE
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE=postgres
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=http://ranrasaceylontea.com,https://ranrasaceylontea.com,http://*.ranrasaceylontea.com,https://*.ranrasaceylontea.com
    depends_on:
      - db
    restart: always

  # --- Frontend (Next.js) ---
  frontend:
    build: ./frontend
    expose:
      - 3000
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend
    restart: always

  # --- Web Server (Nginx) ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    depends_on:
      - backend
      - frontend
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: